; Batas upload untuk hosting yang menjalankan PHP lewat FastCGI/LiteSpeed (kebanyakan shared hosting).
; Satu foto maksimal 7 MB (lihat config/campus.php); galeri maksimal 10 foto sekali unggah.
upload_max_filesize = 8M
post_max_size = 80M
memory_limit = 512M
max_execution_time = 120
max_file_uploads = 20
